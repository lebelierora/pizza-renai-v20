<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>ピザ屋バイトと3人の常連さん</title>
    <style>
      :root{
        --ink:#2b2320;
        --paper:#fff8ef;
        --accent:#d8402a;
        --accent-dark:#a92c1a;
        --tomato:#e2543a;
        --cream:#ffedd6;
        --wood:#8a5a33;
        --dialog-bg:rgba(38,26,20,.88);
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ height:100%; }
      body{
        margin:0;
        font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
        color:var(--ink);
        background:#1d1410;
        overflow:hidden;
        touch-action:manipulation;
        overscroll-behavior:none;
      }
      button{ font-family:inherit; min-height:44px; cursor:pointer; touch-action:manipulation; }
      #app{
        position:fixed; inset:0;
        height:100dvh;
        max-width:860px; margin:0 auto;
        overflow:hidden;
        background:#000;
      }
      /* ---------- 背景 ---------- */
      .bg-layer{ position:absolute; inset:0; opacity:0; transition:opacity .6s ease; pointer-events:none; }
      .bg-layer.active{ opacity:1; }
      .bg-layer svg{ width:100%; height:100%; display:block; }
      .bg-layer img{ width:100%; height:100%; object-fit:cover; object-position:55% 30%; display:block; }
      /* ---------- 立ち絵 ---------- */
      #charLayer{
        position:absolute; left:0; right:0; bottom:0; top:0;
        display:flex; align-items:flex-end; justify-content:center;
        pointer-events:none;
      }
      #charFigure{
        height:min(68dvh,560px);
        max-width:88vw;
        filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));
        opacity:0; transform:translateY(14px);
        transition:opacity .35s ease, transform .35s ease;
      }
      #charFigure.show{ opacity:1; transform:translateY(0); }
      #charFigure svg{ height:100%; width:auto; display:block; }
      /* ---------- シート切り抜き（額縁ポートレート） ---------- */
      #charLayer.portrait-mode{ padding-bottom:calc(172px + env(safe-area-inset-bottom)); }
      #charFigure.portrait{
        height:auto; width:min(80vw,440px);
        filter:none;
      }
      #charFigure.portrait img{
        width:100%; height:auto; display:block;
        border-radius:16px;
        border:4px solid #f6e7cd;
        outline:2px solid rgba(122,58,28,.55);
        box-shadow:0 16px 34px rgba(0,0,0,.45);
        background:#f7ecd9;
      }
      /* ---------- ヒロイン3人：透明切り抜きの立ち絵 ---------- */
      #charLayer.sprite-mode{ padding-bottom:calc(168px + env(safe-area-inset-bottom)); }
      #charFigure.sprite{
        height:auto; width:min(84vw,460px);
        filter:drop-shadow(0 14px 14px rgba(0,0,0,.4));
      }
      #charFigure.sprite img{
        width:100%; height:auto; display:block;
      }
      /* ---------- タイトル画面：お店イラスト＋広場に立つキャスト ---------- */
      #titleScreen{
        overflow-y:auto; padding:0; justify-content:flex-start; align-items:stretch;
        background:#f3ddba;
      }
      .title-stage{ position:relative; width:100%; aspect-ratio:880/1564; flex:none; }
      .title-photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
      .title-scrim-top{
        position:absolute; left:0; right:0; top:0; height:36%;
        background:linear-gradient(180deg, rgba(23,43,68,.45), rgba(23,43,68,0));
        pointer-events:none;
      }
      .title-scrim-bottom{
        position:absolute; left:0; right:0; bottom:0; height:16%;
        background:linear-gradient(0deg, rgba(59,32,14,.34), rgba(59,32,14,0));
        pointer-events:none;
      }
      .title-head{
        position:absolute; left:0; right:0; top:0;
        padding:calc(20px + env(safe-area-inset-top)) 16px 0;
        text-align:center;
      }
      .title-cast{
        position:absolute; left:0; right:0; bottom:10px; height:37%;
        display:flex; align-items:flex-end; justify-content:center;
        gap:2px; padding:0 4px;
      }
      .title-cast figure{
        margin:0; height:100%; min-width:0;
        display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
      }
      .title-cast img{
        height:calc(100% - 36px); width:auto; max-width:100%; display:block;
        filter:drop-shadow(0 8px 7px rgba(70,35,10,.4));
      }
      .title-cast figcaption{
        margin-top:5px; text-align:center; line-height:1.25;
        background:rgba(43,26,16,.72); color:#fff7ec;
        border:1.5px solid rgba(255,224,178,.75);
        border-radius:999px; padding:3px 9px 4px;
        font-size:11.5px; font-weight:800; white-space:nowrap;
      }
      .title-cast figcaption .role{ display:block; font-size:9.5px; font-weight:700; color:#ffd9a8; }
      .title-panel{
        flex:none; display:flex; flex-direction:column; align-items:center;
        padding:18px 20px calc(22px + env(safe-area-inset-bottom));
        background:linear-gradient(180deg,#f8e7c8,#ffedd6);
      }
      /* ---------- ステータスの全身サムネイル ---------- */
      .status-who{ display:flex; align-items:center; font-weight:700; }
      .status-thumb{
        height:86px; width:auto; border-radius:8px; margin-right:12px;
        border:2px solid #e8d5b5; background:#f7ecd9; display:block;
      }
      .status-thumb.cutout{
        border:none; border-radius:0; background:transparent;
      }
      /* ---------- ステータスの主人公プロフィール ---------- */
      .status-hero{ display:flex; gap:4px; align-items:flex-start; padding:2px 0 12px; border-bottom:2px solid #d9c3a5; margin-bottom:6px; }
      .status-hero .status-thumb{ height:118px; }
      .status-hero-body{ min-width:0; }
      .status-hero-name{ font-weight:800; font-size:16px; color:var(--ink); margin:2px 0 5px; }
      .status-hero-name .role{ font-size:12px; color:var(--accent-dark); margin-left:6px; }
      .status-hero-prof{ font-size:13px; line-height:1.75; color:#5a4636; }
      /* ---------- 上部ボタン ---------- */
      #topBar{
        position:absolute; top:calc(8px + env(safe-area-inset-top)); right:10px;
        display:none; gap:8px; z-index:30;
      }
      #topBar.show{ display:flex; }
      .top-btn{
        border:2px solid rgba(255,255,255,.75);
        background:rgba(30,20,14,.62);
        color:#fff; font-size:14px; font-weight:700;
        border-radius:999px; padding:8px 14px; min-height:40px;
        backdrop-filter:blur(2px);
      }
      .top-btn:active{ transform:scale(.96); }
      /* ---------- 会話ウィンドウ ---------- */
      #dialog{
        position:absolute; left:10px; right:10px;
        bottom:calc(10px + env(safe-area-inset-bottom));
        background:var(--dialog-bg);
        border:2px solid rgba(255,214,170,.55);
        border-radius:14px;
        padding:30px 16px 16px;
        min-height:138px;
        color:#fff7ec;
        z-index:20;
        display:none;
        cursor:pointer;
        user-select:none;
      }
      #dialog.show{ display:block; }
      #speaker{
        position:absolute; top:-15px; left:14px;
        background:var(--accent);
        color:#fff; font-weight:800; font-size:15px;
        padding:5px 16px; border-radius:999px;
        border:2px solid #ffd9a8;
        max-width:70%;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      }
      #speaker.narration{ background:#6b5646; }
      #dialogText{
        font-size:17px; line-height:1.75; letter-spacing:.02em;
        min-height:60px; white-space:pre-wrap; word-break:break-word;
      }
      #advanceHint{
        position:absolute; right:14px; bottom:8px;
        font-size:13px; color:#ffd9a8;
        animation:bob 1.1s ease-in-out infinite;
      }
      @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(3px);} }
      /* ---------- 選択肢 ---------- */
      #choiceLayer{
        position:absolute; inset:0; z-index:25;
        display:none; flex-direction:column; align-items:center; justify-content:center;
        gap:12px; padding:20px;
        background:rgba(20,12,8,.38);
      }
      #choiceLayer.show{ display:flex; }
      .choice-btn{
        width:min(92%,520px);
        background:var(--paper);
        border:3px solid var(--accent);
        color:var(--ink);
        font-size:16px; font-weight:700; line-height:1.5;
        border-radius:14px; padding:12px 18px;
        box-shadow:0 6px 0 var(--accent-dark);
      }
      .choice-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--accent-dark); }
      /* ---------- 好感度ポップ ---------- */
      #popupLayer{ position:absolute; inset:0; pointer-events:none; z-index:40; overflow:hidden; }
      .aff-pop{
        position:absolute; left:50%; top:34%;
        transform:translate(-50%,0);
        font-size:24px; font-weight:900; color:#ff5d7a;
        text-shadow:0 2px 0 #fff, 0 0 14px rgba(255,255,255,.9);
        animation:popfloat 1.5s ease-out forwards;
        white-space:nowrap;
      }
      .aff-pop.down{ color:#7d8aa0; }
      @keyframes popfloat{
        0%{ opacity:0; transform:translate(-50%,16px) scale(.7); }
        18%{ opacity:1; transform:translate(-50%,0) scale(1.12); }
        32%{ transform:translate(-50%,-4px) scale(1); }
        75%{ opacity:1; }
        100%{ opacity:0; transform:translate(-50%,-52px) scale(1); }
      }
      /* ---------- ステータス ---------- */
      #statusModal{
        position:absolute; inset:0; z-index:50;
        display:none; align-items:center; justify-content:center;
        background:rgba(15,9,6,.55); padding:20px;
      }
      #statusModal.show{ display:flex; }
      .status-card{
        background:var(--paper); border-radius:16px; border:3px solid var(--wood);
        padding:20px 22px; width:min(92%,400px);
        box-shadow:0 12px 30px rgba(0,0,0,.4);
      }
      .status-card h2{ margin:0 0 12px; font-size:18px; color:var(--accent-dark); }
      .status-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px dashed #d9c3a5; font-size:16px; }
      .status-row:last-of-type{ border-bottom:none; }
      .hearts{ color:#ff5d7a; letter-spacing:2px; font-size:17px; }
      .hearts .off{ color:#d8cfc4; }
      .status-close{
        margin-top:14px; width:100%;
        background:var(--accent); color:#fff; border:none; border-radius:10px;
        font-size:16px; font-weight:800; padding:10px;
      }
      /* ---------- タイトル / エンディング ---------- */
      .screen{
        position:absolute; inset:0; z-index:60;
        display:none; flex-direction:column; align-items:center; justify-content:center;
        text-align:center; padding:24px 20px calc(24px + env(safe-area-inset-bottom));
      }
      .screen.show{ display:flex; }
      .game-title{
        font-size:clamp(27px,7.4vw,42px); font-weight:900; line-height:1.3;
        color:#fff; margin:4px 0 2px;
        text-shadow:0 3px 0 var(--accent-dark), 0 6px 14px rgba(120,40,10,.45);
        letter-spacing:.03em;
      }
      .game-sub{ color:#fff; font-weight:700; font-size:14px; margin:2px 0 16px; text-shadow:0 1px 5px rgba(23,43,68,.8), 0 0 12px rgba(23,43,68,.45); }
      .name-box{
        background:rgba(255,255,255,.92); border:3px solid var(--wood); border-radius:14px;
        padding:14px 16px; width:min(92%,360px); margin-bottom:14px;
      }
      .name-box label{ display:block; font-size:13px; font-weight:800; color:#7a3a1c; margin-bottom:6px; }
      .name-box input{
        width:100%; font-size:18px; font-family:inherit; font-weight:700; text-align:center;
        border:2px solid #d9c3a5; border-radius:10px; padding:10px; background:#fffdf8; color:var(--ink);
        min-height:48px;
      }
      .start-btn{
        background:var(--accent); color:#fff; border:none;
        font-size:20px; font-weight:900; letter-spacing:.08em;
        padding:14px 54px; border-radius:999px;
        box-shadow:0 6px 0 var(--accent-dark);
      }
      .start-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--accent-dark); }
      .title-note{ margin-top:16px; font-size:12.5px; color:#8a5a33; line-height:1.7; }
      #endScreen{ background:linear-gradient(180deg,#2e2440 0%,#5a3350 55%,#a8543c 100%); color:#fff7ec; overflow-y:auto; justify-content:flex-start; }
      #endScreen .end-label{ font-size:13px; letter-spacing:.35em; color:#ffce9a; font-weight:800; margin-top:auto; }
      #endScreen .end-btns{ margin-bottom:auto; }
      #endCard{
        display:none; flex:none; width:min(88vw,420px); height:auto; max-height:46dvh; object-fit:contain; border-radius:16px;
        border:3px solid #ffd9a8; box-shadow:0 14px 34px rgba(0,0,0,.45); margin:14px 0 4px;
      }
      #endCard.show{ display:block; }
      #endTitle{ font-size:clamp(24px,6.6vw,36px); font-weight:900; margin:10px 0 6px; line-height:1.4; }
      #endText{ font-size:15.5px; line-height:1.85; max-width:480px; white-space:pre-wrap; }
      .end-aff{
        background:rgba(255,248,239,.12); border:2px solid rgba(255,217,168,.5);
        border-radius:14px; padding:12px 20px; margin:18px 0 20px; width:min(92%,360px);
        font-size:15px; line-height:2;
      }
      .end-aff .hearts{ font-size:15px; }
      .end-btns{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
      .end-btns button{
        border-radius:999px; font-size:16px; font-weight:800; padding:12px 26px;
        border:3px solid #ffd9a8;
      }
      #againBtn{ background:var(--accent); color:#fff; border-color:#ffd9a8; }
      #toTitleBtn{ background:transparent; color:#fff7ec; }
      @media (max-height:520px){
        #charFigure{ height:56dvh; }
        #charFigure.portrait{ height:auto; width:min(58vw,300px); }
        #charLayer.portrait-mode{ padding-bottom:138px; }
        #charFigure.sprite{ height:auto; width:min(64vw,320px); }
        #charLayer.sprite-mode{ padding-bottom:134px; }
        #dialog{ min-height:112px; padding-top:24px; }
        #dialogText{ font-size:15.5px; min-height:48px; }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <!-- 背景レイヤー（JSでSVGを差し込む） -->
      <div class="bg-layer" id="bg-exterior"></div>
      <div class="bg-layer" id="bg-interior"></div>
      <div class="bg-layer" id="bg-school"></div>
      <div class="bg-layer" id="bg-evening"></div>

      <div id="charLayer"><div id="charFigure"></div></div>

      <div id="topBar">
        <button class="top-btn" id="statusBtn" type="button">💗 ステータス</button>
        <button class="top-btn" id="soundBtn" type="button">♪ 音 ON</button>
      </div>

      <div id="dialog">
        <div id="speaker">　</div>
        <div id="dialogText"></div>
        <div id="advanceHint">▼</div>
      </div>

      <div id="choiceLayer"></div>
      <div id="popupLayer"></div>

      <div id="statusModal">
        <div class="status-card">
          <h2>みんなの好感度</h2>
          <div id="statusRows"></div>
          <button class="status-close" id="statusClose" type="button">閉じる</button>
        </div>
      </div>

      <!-- タイトル画面 -->
      <section class="screen show" id="titleScreen">
        <div class="title-stage">
          <img class="title-photo" src="assets/top-shop.jpg" alt="赤いコンテナのピザ屋「あかいろピザ」の外観イラスト" />
          <div class="title-scrim-top"></div>
          <div class="title-scrim-bottom"></div>
          <div class="title-head">
            <h1 class="game-title">ピザ屋バイトと<br />3人の常連さん</h1>
            <p class="game-sub">〜 赤いコンテナのお店で始まる、短編ラブストーリー 〜</p>
          </div>
          <div class="title-cast">
            <figure>
              <img src="assets/hero-body.png" alt="主人公の全身イラスト" />
              <figcaption id="heroCaption"><span id="heroNameLabel">あなた</span><span class="role">（主人公）</span></figcaption>
            </figure>
            <figure>
              <img src="assets/shiori-body.png" alt="朝倉栞の全身イラスト" />
              <figcaption>朝倉 栞<span class="role">（先輩）</span></figcaption>
            </figure>
            <figure>
              <img src="assets/hina-body.png" alt="小日向陽菜の全身イラスト" />
              <figcaption>小日向 陽菜<span class="role">（同級生）</span></figcaption>
            </figure>
            <figure>
              <img src="assets/tsumugi-body.png" alt="白瀬紬の全身イラスト" />
              <figcaption>白瀬 紬<span class="role">（後輩）</span></figcaption>
            </figure>
          </div>
        </div>
        <div class="title-panel">
          <div class="name-box">
            <label for="nameInput">主人公の名前（バイトの青年）</label>
            <input id="nameInput" type="text" value="ハルト" maxlength="8" autocomplete="off" aria-label="主人公の名前" />
          </div>
          <button class="start-btn" id="startBtn" type="button">バイトをはじめる</button>
          <p class="title-note">画面タップで会話が進みます。所要時間は5〜10分ほど。<br />選択肢で3人の好感度が変わり、結末が分岐します。</p>
        </div>
      </section>

      <!-- エンディング画面 -->
      <section class="screen" id="endScreen">
        <div class="end-label">ENDING</div>
        <img id="endCard" alt="エンドカード" />
        <h2 id="endTitle"></h2>
        <p id="endText"></p>
        <div class="end-aff" id="endAff"></div>
        <div class="end-btns">
          <button id="againBtn" type="button">もう一度遊ぶ</button>
          <button id="toTitleBtn" type="button">タイトルに戻る</button>
        </div>
      </section>
    </main>
    <script>
      "use strict";
      /* ================= 背景SVG ================= */
      var BG = {
        exterior:
        '<svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +

                '<img class="status-thumb cutout" src="assets/' + BODY_IMG.hero + '" alt="" />' +
                '<div class="status-hero-body"><div class="status-hero-name">' + safeName + '<span class="role">主人公</span></div>' +
                '<div class="status-hero-prof">20歳｜調理専門学校 2年生<br />ピザ屋で働き始めた新入りバイト<br />ピザ作りは、まだまだ練習中<br />不器用だけど、何事にも一生懸命</div></div></div>';
        ["asakura","hina","aoi"].forEach(function(k){
          rows += '<div class="status-row"><span class="status-who">' +
                  '<img class="status-thumb cutout" src="assets/' + BODY_IMG[k] + '" alt="" />' + NAMES[k] + '</span>' +
                  '<span class="hearts">' + hearts(state ? state.aff[k] : 0) + '</span></div>';
        });
        rows += '<div class="status-hero" style="border-bottom:none;border-top:2px solid #d9c3a5;margin-top:10px;padding-top:12px;margin-bottom:0;padding-bottom:2px;">' +
                '<img class="status-thumb cutout" src="assets/' + BODY_IMG.manager + '" alt="" />' +
                '<div class="status-hero-body"><div class="status-hero-name">マスター<span class="role">店主</span></div>' +
                '<div class="status-hero-prof">40代、気持ちは20代！<br />赤いピザ屋の店主<br />新しいことが好きな、陽気な兄貴分<br />ピザを焼くときは、頼れる職人<br />主人公と常連たちを温かく見守る</div></div></div>';
        $("statusRows").innerHTML = rows;
      }
      $("statusBtn").addEventListener("click", function(e){
        e.stopPropagation(); AudioSys.resume(); renderStatus();
        $("statusModal").classList.add("show");
      });
      $("statusClose").addEventListener("click", function(e){
        e.stopPropagation(); $("statusModal").classList.remove("show");
      });
      $("statusModal").addEventListener("click", function(e){
        if(e.target === this){ this.classList.remove("show"); }
      });
      /* ---------- 音ON/OFF ---------- */
      $("soundBtn").addEventListener("click", function(e){
        e.stopPropagation();
        AudioSys.resume();
        AudioSys.on = !AudioSys.on;
        this.textContent = AudioSys.on ? "♪ 音 ON" : "♪ 音 OFF";
        if(AudioSys.on){ AudioSys.startMusic(); } else { AudioSys.stopMusic(); }
      });
      /* ---------- 開始 / 終了 ---------- */
      $("nameInput").addEventListener("input", function(){
        var v = this.value.trim();
        $("heroNameLabel").textContent = v ? v : "あなた";
      });
      (function(){
        var v = $("nameInput").value.trim();
        $("heroNameLabel").textContent = v ? v : "あなた";
      })();
      function startGame(){
        var name = $("nameInput").value.trim() || "ハルト";
        state = freshState(name);
        $("titleScreen").classList.remove("show");
        $("endScreen").classList.remove("show");
        dialogEl.classList.add("show");
        $("topBar").classList.add("show");
        setChar(null); setBg("exterior");
        processNext();
      }
      function showEndScreen(){
        var key = state.currentEnding || "normal";
        var end = ENDINGS[key];
        dialogEl.classList.remove("show");
        $("topBar").classList.remove("show");
        setChar(null);
        var cardEl = $("endCard");
        var cardSrc = null;
        if(state.maxed === key && ENDCARDS[key]){ cardSrc = ENDCARDS[key]; }
        else if(key === "zero"){ cardSrc = NORMAL_ENDCARD; }
        else if(key === "normal"){ cardSrc = TRAINING_ENDCARD; }
        if(cardSrc){
          cardEl.src = cardSrc;
          cardEl.classList.add("show");
        } else {
          cardEl.classList.remove("show");
          cardEl.removeAttribute("src");
        }
        $("endTitle").textContent = end.title;
        $("endText").textContent = subst(end.text);
        var rows = "<div>【" + end.label + "】到達</div>";
        if(state.maxed === key){
          rows += '<div style="color:#ff9db4;font-weight:800;">💗 一筋ボーナスで ' + NAMES[key] + ' の好感度がMAXに！</div>';
        }
        ["asakura","hina","aoi"].forEach(function(k){
          rows += '<div>' + NAMES[k] + ' <span class="hearts">' + hearts(state.aff[k]) + '</span> ' + state.aff[k] + '</div>';
        });
        $("endAff").innerHTML = rows;
        $("endScreen").classList.add("show");
        AudioSys.pop(true);
      }
      $("startBtn").addEventListener("click", function(){
        AudioSys.resume();
        if(AudioSys.on) AudioSys.startMusic();
        startGame();
      });
      $("againBtn").addEventListener("click", function(){
        AudioSys.resume();
        if(AudioSys.on) AudioSys.startMusic();
        state = freshState(state ? state.name : ($("nameInput").value.trim() || "ハルト"));
        $("endScreen").classList.remove("show");
        dialogEl.classList.add("show");
        $("topBar").classList.add("show");
        setChar(null); setBg("exterior");
        processNext();
      });
      $("toTitleBtn").addEventListener("click", function(){
        state = null;
        $("endScreen").classList.remove("show");
        dialogEl.classList.remove("show");
        $("topBar").classList.remove("show");
        setChar(null); setBg("exterior");
        $("titleScreen").classList.add("show");
      });
    </script>
</body>
</html>
